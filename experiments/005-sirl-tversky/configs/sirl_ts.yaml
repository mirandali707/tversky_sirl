experiment_name: sirl_ts
seeds: [0, 1, 2]
data:
    dataset_name: gridrobot_1960 
    path: simulated_data/001-gridrobot/data/gridrobot_1960.npz
model:
    load_ckpt: False
    name: sirl_ts
    encoder: sirl
    latent_dim: [2,4,6,8,10]
    hidden_dim: 128
    num_epochs: 8000
    lr: 0.01
    lr_decay: 0.99999
    log_interval: 100
    fbank_size: [2, 4, 8, 16, 32, 64, 128, 256]
    similarity_model: ratio 
    intersection_reduction: product
    difference_reduction: substractmatch
    normalize: True
    symmetric: False
    margin: 0.1 
eval:
    - method: query
      max_pairs: 1000
    - method: tsne