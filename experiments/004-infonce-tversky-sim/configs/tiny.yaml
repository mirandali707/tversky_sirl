experiment_name: tiny_literally_just_tversky_sim_gridrobot_laptop_ONLY
seeds: [0]
data:
    dataset_name: gridrobot_1960 
    path: simulated_data/001-gridrobot/data/gridrobot_1960.npz
model:
    load_ckpt: False
    name: literally_just_tversky_sim
    num_epochs: 8000
    lr: 0.01
    lr_decay: 0.99999
    tau: 0.1
    log_interval: 100
    fbank_size: [4] # added 256 here to see if it keeps going up or what
    batch_size: 16
    similarity_model: contrast
    intersection_reduction: product
    difference_reduction: substractmatch
eval:
    - method: query
      max_pairs: 1000