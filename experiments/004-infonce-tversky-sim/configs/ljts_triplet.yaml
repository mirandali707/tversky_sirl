experiment_name: ljts_triplet
seeds: [0, 1, 2]
data:
    dataset_name: gridrobot_1960 
    path: simulated_data/001-gridrobot/data/gridrobot_1960.npz
model:
    encoder: identity
    load_ckpt: False
    name: literally_just_tversky_sim
    num_epochs: 8000
    lr: 0.001
    normalize: True 
    lr_decay: 0.99999
    symmetric: [True, False]
    margin: 10
    log_interval: 100
    batch_size: 64
    fbank_size: [2, 4, 8, 16, 32, 64, 128, 256] # added 256 here to see if it keeps going up or what
    similarity_model: contrast
    intersection_reduction: product
    difference_reduction: substractmatch
eval:
    - method: query
      max_pairs: 1000